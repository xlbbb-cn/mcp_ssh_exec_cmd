name: Publish to GitHub Packages and npmjs

# Publishes the package to two registries:
#   * GitHub Packages �?https://npm.pkg.github.com  (GITHUB_TOKEN)
#   * npmjs.org       �?https://registry.npmjs.org (NPM_TOKEN secret)
#
# GitHub Packages uses the built-in GITHUB_TOKEN, so nothing has to be
# stored in the repository for it. npmjs.org needs an npm token in the
# repository secret "NPM_TOKEN"; without that secret the npmjs job
# skips the publish instead of failing. If 2FA is enabled on the npm
# account the token has to be an *automation* token - a regular user
# token makes npmjs.org answer with EOTP (one-time password required).
#
# Trigger it by pushing a version tag:
#     git tag v0.1.0 && git push github v0.1.0
# or manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only verify what would be published, do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write # required for npm provenance

jobs:
  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@xlbbb-cn"

      - name: Install dependencies
        run: npm ci --allow-scripts=ssh2,cpu-features

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          set +e
          npm publish --provenance --access public 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          set -e
          if [ $code -ne 0 ]; then
            if grep -q "Cannot publish over existing version" publish.log; then
              echo "::notice::version $VERSION is already published on GitHub Packages - nothing to do."
              exit 0
            fi
            exit $code
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npmjs:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@xlbbb-cn"

      # The repository .npmrc routes the @xlbbb-cn scope to GitHub
      # Packages. A scope mapping wins over --registry, so it has to be
      # overridden explicitly for the npmjs.org publish.
      - name: Point the scope at npmjs.org
        run: npm config set @xlbbb-cn:registry https://registry.npmjs.org --location=project

      - name: Install dependencies
        run: npm ci --allow-scripts=ssh2,cpu-features

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Look for the npm token
        id: token
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No NPM_TOKEN secret found - skipping the npmjs.org publish. Add one under Settings > Secrets and variables > Actions."
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify package contents
        if: ${{ steps.token.outputs.present == 'true' }}
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ steps.token.outputs.present == 'true' && !inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "npm account behind NPM_TOKEN: $(npm whoami --registry=https://registry.npmjs.org || echo 'unknown')"
          set +e
          npm publish --provenance --access public 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          set -e
          if [ $code -ne 0 ]; then
            if grep -q "Cannot publish over existing version" publish.log; then
              echo "::notice::version $VERSION is already published on npmjs.org - nothing to do."
              exit 0
            fi
            if grep -q "one-time password\|EOTP" publish.log; then
              echo "::error::npmjs.org demanded a one-time password (EOTP). With 2FA enabled the NPM_TOKEN secret has to be an *automation* token (npmjs.org > Access Tokens > Generate New Token > Automation), not a regular user token."
            fi
            if grep -qi "you do not have permission to publish under the" publish.log; then
              echo "::error::The npm account behind NPM_TOKEN does not own the @xlbbb-cn scope. Either publish under a scope that account owns, or switch the package to an unscoped name."
            fi
            exit $code
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
