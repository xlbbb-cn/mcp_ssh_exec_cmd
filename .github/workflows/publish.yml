name: Publish to GitHub Packages and npmjs

# Publishes the package to three places:
#   * GitHub Packages - https://npm.pkg.github.com  (GITHUB_TOKEN)
#   * npmjs.org       - https://registry.npmjs.org (trusted publishing)
#   * MCP Registry    - https://registry.modelcontextprotocol.io
#                       (server.json metadata, GitHub OIDC - runs after
#                       the npmjs.org job because the registry verifies
#                       the mcpName marker by reading the package from
#                       registry.npmjs.org)
#
# GitHub Packages uses the built-in GITHUB_TOKEN, so nothing has to be
# stored in the repository for it.
#
# npmjs.org is published with *trusted publishing* (OIDC): the npm CLI
# exchanges the short-lived GitHub Actions OIDC token for a publish
# token, so no long-lived secret is needed either. It requires
#   - npm CLI >= 11.5.1 and Node >= 22.14.0
#   - "id-token: write" (set below)
#   - a trusted publisher configured on npmjs.com for this package:
#     user/organization "xlbbb-cn", repository "mcp_ssh_exec_cmd",
#     workflow filename "publish.yml"
#
# A classic token in the repository secret "NPM_TOKEN" is still honoured
# as a fallback for the very first publish (before the trusted publisher
# exists) - it must be a granular token with "Read and write" access on
# the @xlbbb-cn scope and "Bypass 2FA" enabled.
#
# Trigger it by pushing a version tag:
#     git tag v0.1.0 && git push github v0.1.0
# or manually from the Actions tab (workflow_dispatch).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only verify what would be published, do not publish"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
  id-token: write # required for npm provenance and trusted publishing

jobs:
  publish-github-packages:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: "@xlbbb-cn"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm publish --dry-run --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          set +e
          npm publish --provenance --access public 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          set -e
          if [ $code -ne 0 ]; then
            if grep -qE "Cannot publish over existing version|previously published versions" publish.log; then
              echo "::notice::version $VERSION is already published on GitHub Packages - nothing to do."
              exit 0
            fi
            exit $code
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-npmjs:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          scope: "@xlbbb-cn"

      # Trusted publishing needs npm >= 11.5.1; the npm bundled with
      # Node 24 is new enough, but upgrade explicitly so the workflow
      # keeps working when the runner image changes.
      - name: Make sure npm supports trusted publishing
        run: npm install -g "npm@^11"

      # The repository .npmrc routes the @xlbbb-cn scope to GitHub
      # Packages. A scope mapping wins over --registry, so it has to be
      # overridden explicitly for the npmjs.org publish.
      - name: Point the scope at npmjs.org
        run: npm config set @xlbbb-cn:registry https://registry.npmjs.org --location=project

      # Trusted publishing (OIDC) needs no token at all. The NPM_TOKEN
      # secret is only a fallback for the first publish, before the
      # trusted publisher exists on npmjs.com.
      - name: Configure the npm credentials
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=$NPM_TOKEN" >> .npmrc
            echo "using the NPM_TOKEN secret (fallback)"
          else
            echo "no NPM_TOKEN secret - publishing through trusted publishing (OIDC)"
          fi
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Verify package contents
        run: npm publish --dry-run --access public

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "npm account: $(npm whoami --registry=https://registry.npmjs.org || echo 'unknown (expected with trusted publishing)')"
          set +e
          npm publish --provenance --access public 2>&1 | tee publish.log
          code=${PIPESTATUS[0]}
          set -e
          if [ $code -ne 0 ]; then
            if grep -qE "Cannot publish over existing version|previously published versions" publish.log; then
              echo "::notice::version $VERSION is already published on npmjs.org - nothing to do."
              exit 0
            fi
            if grep -q "one-time password\|EOTP" publish.log; then
              echo "::error::npmjs.org demanded a one-time password (EOTP). The NPM_TOKEN secret must be a granular token with 'Bypass 2FA' enabled - or drop the secret entirely and configure a trusted publisher on npmjs.com."
            fi
            if grep -qi "you do not have permission to publish under the" publish.log; then
              echo "::error::The npm account behind NPM_TOKEN does not own the @xlbbb-cn scope."
            fi
            if grep -qi "unable to authenticate\|ENEEDAUTH\|404 Not Found" publish.log; then
              echo "::error::npmjs.org rejected the credentials. Either the NPM_TOKEN secret is wrong, or no trusted publisher is configured for this package (npmjs.com > Packages > @xlbbb-cn/mcp_ssh_exec_cmd > Settings > Trusted publishing)."
            fi
            exit $code
          fi

  publish-mcp-registry:
    name: Publish to the official MCP Registry
    runs-on: ubuntu-latest

    # The registry verifies npm package ownership by reading mcpName
    # from the package on registry.npmjs.org, so this job must run
    # after the npmjs.org publish.
    needs: publish-npmjs

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Pinned so an upstream CLI change cannot break the release
      # pipeline unannounced - bump it deliberately and re-validate.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          sudo install -m 755 mcp-publisher /usr/local/bin/mcp-publisher

      - name: Keep server.json in sync with package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json
          echo "server.json version -> $VERSION"

      - name: Validate server.json
        run: mcp-publisher validate ./server.json

      - name: Authenticate (GitHub OIDC)
        if: ${{ !inputs.dry_run }}
        run: mcp-publisher login github-oidc

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: |
          # Two attempts: the registry's npm ownership check fetches the
          # just-published package and can transiently fail.
          set +e
          for attempt in 1 2; do
            mcp-publisher publish ./server.json 2>&1 | tee publish-registry.log
            code=${PIPESTATUS[0]}
            if [ $code -eq 0 ]; then break; fi
            if grep -qiE "already exists|already published|duplicate|conflict" publish-registry.log; then
              echo "::notice::this server.json version is already in the MCP Registry - nothing to do."
              code=0
              break
            fi
            if [ $attempt -eq 1 ]; then echo "publish failed, retrying in 30s..."; sleep 30; fi
          done
          set -e
          if [ $code -ne 0 ]; then
            # Job logs need admin rights - surface the error in a public
            # annotation and in the step summary instead.
            echo "::error::MCP Registry publish failed: $(tr '\n' ' ' < publish-registry.log | tail -c 2000)"
            {
              echo "### MCP Registry publish failed"
              echo '```'
              cat publish-registry.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit $code
          fi
